<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI for Advocacy | Training Hub</title>

<style>

body{
margin:0;
font-family:'Trebuchet MS',sans-serif;
color:white;

background:
radial-gradient(circle at 20% 20%, #7c3aed 0%, transparent 40%),
radial-gradient(circle at 80% 30%, #06b6d4 0%, transparent 40%),
radial-gradient(circle at 40% 80%, #8b5cf6 0%, transparent 40%),
linear-gradient(135deg,#0f172a,#1e1b4b,#020617);

min-height:100vh;
overflow-x:hidden;
}

/* ---------------- */
/* SOFT TWINKLING STARS */
/* ---------------- */

.stars{
position:fixed;
inset:0;
pointer-events:none;
z-index:1;
}

.star{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;

box-shadow:
0 0 3px rgba(255,255,255,.6),
0 0 6px rgba(255,255,255,.4);

animation:twinkle 5s infinite ease-in-out;
}

.star.small{
width:2px;
height:2px;
animation-duration:4s;
}

.star.medium{
width:5px;
height:5px;
animation-duration:6s;
}

@keyframes twinkle{
0%{opacity:.3;transform:scale(.7);}
50%{opacity:.8;transform:scale(1.2);}
100%{opacity:.3;transform:scale(.7);}
}

/* ---------------- */
/* DRIFTING MAGIC DUST */
/* ---------------- */

.magic-dust{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
}

.dust{
position:absolute;
width:3px;
height:3px;
border-radius:50%;
background:rgba(255,255,255,.8);

box-shadow:
0 0 4px rgba(255,255,255,.5),
0 0 8px rgba(255,255,255,.3);

opacity:.35;

animation:drift 45s linear infinite;
}

@keyframes drift{

0%{
transform:translate(0px,0px);
opacity:.25;
}

50%{
transform:translate(20px,-600px);
opacity:.5;
}

100%{
transform:translate(-15px,-1200px);
opacity:.25;
}

}

/* ---------------- */
/* SHOOTING STARS */
/* ---------------- */

.shooting-star{
position:fixed;
width:120px;
height:2px;

background:linear-gradient(
90deg,
rgba(255,255,255,0),
rgba(255,255,255,.9),
rgba(255,255,255,0)
);

box-shadow:
0 0 6px rgba(255,255,255,.6);

opacity:0;
transform:rotate(-25deg);
pointer-events:none;
z-index:2;
}

.shooting-star.one{
top:12%;
left:-20%;
animation:shoot1 12s linear infinite;
animation-delay:2s;
}

.shooting-star.two{
top:35%;
left:-30%;
animation:shoot2 14s linear infinite;
animation-delay:7s;
}

@keyframes shoot1{

0%,85%{
opacity:0;
transform:translateX(0) translateY(0) rotate(-25deg);
}

87%{opacity:.8;}

100%{
opacity:0;
transform:translateX(1400px) translateY(320px) rotate(-25deg);
}

}

@keyframes shoot2{

0%,88%{
opacity:0;
transform:translateX(0) translateY(0) rotate(-25deg);
}

90%{opacity:.8;}

100%{
opacity:0;
transform:translateX(1500px) translateY(360px) rotate(-25deg);
}

}

/* ---------------- */
/* LAYOUT */
/* ---------------- */

.container{
max-width:1100px;
margin:0 auto;
padding:40px 20px 70px;
position:relative;
z-index:3;
}

/* ---------------- */
/* GLASS CARDS */
/* ---------------- */

.hero,.card,.prompt-box{
background:rgba(15,23,42,.65);
border:1px solid rgba(255,255,255,.12);
border-radius:22px;

box-shadow:
0 0 15px rgba(255,255,255,.05);

backdrop-filter:blur(10px);
}

.hero{
padding:32px;
margin-bottom:28px;
}

/* ---------------- */
/* BADGE */
/* ---------------- */

.badge{
display:inline-block;
padding:6px 12px;
border:1px solid rgba(255,255,255,.25);
border-radius:999px;

background:linear-gradient(
135deg,
#06b6d4,
#22d3ee
);

color:#021018;
font-weight:700;
font-size:12px;
text-transform:uppercase;
letter-spacing:.08em;
margin-bottom:14px;

box-shadow:
0 0 6px rgba(255,255,255,.4);
}

/* ---------------- */
/* HEADINGS */
/* ---------------- */

h1{
font-size:48px;
margin:0 0 10px;
letter-spacing:2px;

text-shadow:
0 0 4px rgba(255,255,255,.5),
0 0 10px rgba(255,255,255,.3);
}

h2{
margin-top:0;
font-size:28px;
}

.subhead{
color:#e0e7ff;
font-size:18px;
margin-bottom:0;
}

/* ---------------- */
/* SECTIONS */
/* ---------------- */

.tip,.start,.prompt-section{
margin-bottom:28px;
padding:24px;
}

.tip{
display:inline-block;
margin-top:18px;
border:1px solid rgba(255,255,255,.15);
border-radius:14px;
background:rgba(255,255,255,.08);
padding:12px 16px;
}

.start{
background:rgba(34,211,238,.1);
}

.prompt-section{
background:rgba(34,211,238,.08);
}

.prompt-box{
padding:16px;
margin-top:16px;
background:rgba(255,255,255,.06);
}

.prompt-label{
font-weight:bold;
margin-bottom:8px;
}

.prompt-text{
font-family:"Courier New",monospace;
font-size:14px;
line-height:1.5;
white-space:pre-wrap;
color:#f8fafc;
}

/* ---------------- */
/* BUTTON */
/* ---------------- */

.copy-btn{
margin-top:12px;

background:linear-gradient(
135deg,
#06b6d4,
#22d3ee
);

color:white;
border:1px solid rgba(255,255,255,.2);
border-radius:10px;
padding:8px 12px;
font-weight:bold;
cursor:pointer;
}

/* ---------------- */
/* GRID */
/* ---------------- */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:22px;
}

.card{
padding:20px;
}

/* ---------------- */
/* LINKS */
/* ---------------- */

.link-btn,.placeholder{
display:block;
margin-top:10px;
padding:12px 14px;
border-radius:14px;
border:1px solid rgba(255,255,255,.2);
text-decoration:none;
}

.link-btn{
background:rgba(255,255,255,.08);
color:white;
font-weight:bold;
}

.link-btn:hover{
background:rgba(6,182,212,.2);
}

.placeholder{
background:rgba(255,255,255,.05);
color:#cbd5e1;
font-style:italic;
border-style:dashed;
}

.home-link{
display:inline-block;
margin-bottom:20px;
color:#7dd3fc;
text-decoration:none;
font-weight:bold;
}

.footer{
margin-top:34px;
font-size:14px;
line-height:1.6;
color:#cbd5f5;
border-top:1px solid rgba(255,255,255,.15);
padding-top:20px;
}

</style>
</head>

<body>

<div class="stars">

<div class="star small" style="top:10%;left:20%"></div>
<div class="star medium" style="top:25%;left:80%"></div>
<div class="star" style="top:40%;left:15%"></div>
<div class="star medium" style="top:60%;left:70%"></div>
<div class="star" style="top:75%;left:35%"></div>
<div class="star small" style="top:15%;left:55%"></div>
<div class="star medium" style="top:50%;left:50%"></div>
<div class="star" style="top:85%;left:80%"></div>

</div>

<div class="magic-dust">

<div class="dust" style="left:10%;animation-delay:0s"></div>
<div class="dust" style="left:20%;animation-delay:8s"></div>
<div class="dust" style="left:30%;animation-delay:14s"></div>
<div class="dust" style="left:40%;animation-delay:5s"></div>
<div class="dust" style="left:50%;animation-delay:11s"></div>
<div class="dust" style="left:60%;animation-delay:17s"></div>
<div class="dust" style="left:70%;animation-delay:3s"></div>
<div class="dust" style="left:80%;animation-delay:13s"></div>
<div class="dust" style="left:90%;animation-delay:20s"></div>

</div>

<div class="shooting-star one"></div>
<div class="shooting-star two"></div>

<div class="container">

<a class="home-link" href="/">← Back to Luna Blaze Home</a>

<section class="hero">

<div class="badge">Agents of Advocacy</div>

<h1>AI for Advocacy Training Hub</h1>

<p class="subhead">
Tools, prompts, and real examples to help educators organize, communicate, and build collective power.
</p>

<div class="tip">
<strong>Tip:</strong> Bookmark this page so you can return to the tools after the session.
</div>

</section>

</div>

<script>

async function copyPrompt(id,button){

const text=document.getElementById(id).innerText;

try{

await navigator.clipboard.writeText(text);

const original=button.innerText;

button.innerText="Copied!";

setTimeout(()=>{

button.innerText=original;

},1500);

}catch(e){

alert("Copy failed. Please copy manually.");

}

}

</script>

</body>
</html>
